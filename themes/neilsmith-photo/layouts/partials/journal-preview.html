<section class="journal-preview-section" aria-label="Journal">
  <div class="section">
    <div class="section-header">
      <span class="section-num">// JOURNAL</span>
      <h2 class="section-title">Latest Writing</h2>
      <div class="section-line"></div>
      <a href="/journal" class="section-link">All posts →</a>
    </div>
    <div class="journal-preview-grid">
      {{ range first 3 (where .Site.RegularPages "Section" "journal") }}
      <a href="{{ .Permalink }}" class="journal-preview-card">
        <div class="journal-preview-date">{{ .Date.Format "02 Jan 2006" }}</div>
        <h3 class="journal-preview-title">{{ .Title }}</h3>
        <p class="journal-preview-desc">{{ .Description }}</p>
        <div class="journal-preview-tags">
          {{ range .Params.tags }}
          <span class="tag">{{ . }}</span>
          {{ end }}
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</section>
