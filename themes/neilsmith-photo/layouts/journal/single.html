{{ define "main" }}
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-tag">// {{ .Date.Format "02 Jan 2006" }}</div>
    <h1 class="page-title">{{ .Title }}</h1>
    <div class="post-tags">
      {{ range .Params.tags }}
      <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
  </div>
</div>

<div class="post-layout">
  <article class="post-content">
    {{ .Content }}
  </article>
  <aside class="post-sidebar">
    <a href="/journal" class="btn-ghost">← All posts</a>
  </aside>
</div>
{{ end }}
